[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
# Farklılık testi JS referansını node ile çalıştırır.
ffi = true
fs_permissions = [{ access = "read", path = "./test/js" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 40
fail_on_revert = false
